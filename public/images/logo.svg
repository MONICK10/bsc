<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#001F3F" stroke="#0EA5E9" stroke-width="3"/>
  
  <!-- Bear Head -->
  <circle cx="100" cy="85" r="50" fill="#8B7355"/>
  
  <!-- Left Ear -->
  <circle cx="65" cy="50" r="15" fill="#8B7355"/>
  <circle cx="65" cy="50" r="8" fill="#A0826D"/>
  
  <!-- Right Ear -->
  <circle cx="135" cy="50" r="15" fill="#8B7355"/>
  <circle cx="135" cy="50" r="8" fill="#A0826D"/>
  
  <!-- Left Eye -->
  <circle cx="80" cy="80" r="8" fill="white"/>
  <circle cx="80" cy="80" r="5" fill="black"/>
  
  <!-- Right Eye -->
  <circle cx="120" cy="80" r="8" fill="white"/>
  <circle cx="120" cy="80" r="5" fill="black"/>
  
  <!-- Snout -->
  <ellipse cx="100" cy="100" rx="20" ry="18" fill="#A0826D"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="95" rx="6" ry="5" fill="black"/>
  
  <!-- Mouth -->
  <path d="M 100 95 Q 90 105 85 105" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 100 95 Q 110 105 115 105" stroke="black" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Shield Badge -->
  <g transform="translate(130, 115)">
    <path d="M 0 0 L 25 0 L 25 30 Q 12.5 40 0 30 Z" fill="#0EA5E9" stroke="white" stroke-width="2"/>
    <text x="12.5" y="22" font-size="20" font-weight="bold" text-anchor="middle" fill="white">B</text>
  </g>
  
  <!-- Sports Icon - Football at bottom left -->
  <ellipse cx="35" cy="150" rx="8" ry="6" fill="#0EA5E9" opacity="0.7"/>
  
  <!-- Sports Icon - Hockey stick at bottom right -->
  <path d="M 165 150 L 165 160 L 175 160" stroke="#0EA5E9" stroke-width="2" fill="none" opacity="0.7"/>
  
  <!-- Star accent -->
  <g transform="translate(100, 35)">
    <polygon points="0,-5 1.5,-1.5 5,-1.5 2,1 3.5,5 0,2 -3.5,5 -2,1 -5,-1.5 -1.5,-1.5" fill="#FFD700"/>
  </g>
</svg>