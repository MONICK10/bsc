services:
  - type: web
    name: bearhatty-sports-club
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: https://bsc3.onrender.com
      - key: PORT
        value: 3001
    routes:
      - path: /
        destination: /
      - path: /api
        destination: /api
      - path: /uploads
        destination: /uploads
